openapi: 3.1.0
info:
  title: Oanh Accounting API
  version: 0.10.0
  description: Một pháp nhân, VND scale 0. Tiền và decimal là chuỗi. Lệnh tài chính không tự retry; gửi lại cùng
    key/payload/epoch. Mọi POST JSON từ chối trường không được khai báo. Xem api/README.md về giới hạn nghiệp vụ.
servers:
- url: /api/v1
security:
- SessionCookie: []
paths:
  /excel-imports/schemas:
    get:
      summary: Loại và cột nhập theo quyền
      responses:
        '200':
          description: Thành công; lệnh ghi chỉ trả sau commit.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExcelSchema'
        default:
          description: Lỗi quyền, dữ liệu, epoch hoặc phiên bản.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /excel-imports/template:
    get:
      summary: Tải mẫu XLSX cơ bản hoặc nâng cao
      responses:
        '200':
          description: Thành công; lệnh ghi chỉ trả sau commit.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        default:
          description: Lỗi quyền, dữ liệu, epoch hoặc phiên bản.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - in: query
        name: kind
        required: true
        schema:
          type: string
          enum:
          - partners
          - accounts
          - items
          - warehouses
          - banks
          - employees
          - journal-pairs
          - journal-lines
          - receipt
          - payment
          - transfer
          - sale
          - purchase
          - opening
      - in: query
        name: advanced
        required: false
        schema:
          type: boolean
  /excel-imports/files:
    post:
      summary: Lưu tệp XLSX/CSV vào vùng chờ (tối đa20MB)
      responses:
        '200':
          description: Thành công; lệnh ghi chỉ trả sau commit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExcelBatch'
        default:
          description: Lỗi quyền, dữ liệu, epoch hoặc phiên bản.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - in: header
        name: X-Dataset-Epoch
        required: true
        schema:
          type: string
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
  /excel-imports:
    get:
      summary: 50 tệp gần nhất của actor
      responses:
        '200':
          description: Thành công; lệnh ghi chỉ trả sau commit.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExcelBatch'
        default:
          description: Lỗi quyền, dữ liệu, epoch hoặc phiên bản.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - in: header
        name: X-Dataset-Epoch
        required: true
        schema:
          type: string
  /excel-imports/{id}:
    get:
      summary: Xem sheet, tiêu đề và10dòng dữ liệu mẫu
      responses:
        '200':
          description: Thành công; lệnh ghi chỉ trả sau commit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExcelSource'
        default:
          description: Lỗi quyền, dữ liệu, epoch hoặc phiên bản.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: header
        name: X-Dataset-Epoch
        required: true
        schema:
          type: string
      - in: query
        name: sheet
        required: false
        schema:
          type: string
      - in: query
        name: headerRow
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
  /excel-imports/{id}/configuration:
    post:
      summary: Lưu thiết lập ghép cột
      responses:
        '200':
          description: Thành công; lệnh ghi chỉ trả sau commit.
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved:
                    type: boolean
        default:
          description: Lỗi quyền, dữ liệu, epoch hoặc phiên bản.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: header
        name: X-Dataset-Epoch
        required: true
        schema:
          type: string
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExcelConfiguration'
  /excel-imports/{id}/preview:
    post:
      summary: Kiểm tra toàn bộ rồi rollback
      responses:
        '200':
          description: Thành công; lệnh ghi chỉ trả sau commit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExcelPreview'
        default:
          description: Lỗi quyền, dữ liệu, epoch hoặc phiên bản.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: header
        name: X-Dataset-Epoch
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExcelConfiguration'
  /excel-imports/{id}/errors:
    post:
      summary: Tải XLSX lỗi kiểm tra
      responses:
        '200':
          description: Thành công; lệnh ghi chỉ trả sau commit.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        default:
          description: Lỗi quyền, dữ liệu, epoch hoặc phiên bản.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: header
        name: X-Dataset-Epoch
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExcelConfiguration'
  /excel-imports/{id}/commit:
    post:
      summary: Nhập toàn bộ gói; chứng từ và số dư chỉ lưu nháp
      responses:
        '200':
          description: Thành công; lệnh ghi chỉ trả sau commit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExcelResult'
        default:
          description: Lỗi quyền, dữ liệu, epoch hoặc phiên bản.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: header
        name: X-Dataset-Epoch
        required: true
        schema:
          type: string
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExcelCommit'
  /excel-imports/{id}/discard:
    post:
      summary: Bỏ tệp chờ của actor
      responses:
        '200':
          description: Thành công; lệnh ghi chỉ trả sau commit.
          content:
            application/json:
              schema:
                type: object
                properties:
                  discarded:
                    type: boolean
        default:
          description: Lỗi quyền, dữ liệu, epoch hoặc phiên bản.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: header
        name: X-Dataset-Epoch
        required: true
        schema:
          type: string
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
  /opening-balances:
    get:
      summary: Đọc số dư đầu kỳ
      operationId: get_opening_balances
      description: 'Đọc cho mọi vai trò. Dữ liệu cùng snapshot.'
      responses:
        '200':
          description: Thành công sau commit đối với lệnh ghi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpeningState'
        default:
          description: Lỗi nghiệp vụ hoặc phiên bản.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Lưu nháp số dư đầu kỳ
      operationId: save_opening_balances
      description: 'Chỉ chủ sở hữu. Kiểm tra epoch, version và idempotency trong transaction; khởi tạo trước lần ghi sổ đầu tiên.'
      responses:
        '200':
          description: Thành công sau commit đối với lệnh ghi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpeningState'
        default:
          description: Lỗi nghiệp vụ hoặc phiên bản.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      - in: header
        name: X-Dataset-Epoch
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpeningInput'
  /opening-balances/adjustments:
    post:
      summary: Lưu nháp điều chỉnh số dư
      operationId: opening_adjustment_post_collection
      description: 'Chỉ chủ sở hữu; epoch/idempotency/version được kiểm tra trong cùng transaction. Xác nhận kiểm tra lại revision xem trước và toàn bộ phụ thuộc.'
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema: {type: string}
      - in: header
        name: X-Dataset-Epoch
        required: true
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpeningAdjustmentInput'
      responses:
        '200':
          description: Thành công; lệnh ghi trả về sau commit.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpeningState'}
        default:
          description: Lỗi nghiệp vụ, quyền hoặc phiên bản.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    get:
      summary: Đọc lịch sử điều chỉnh số dư
      operationId: opening_adjustment_get_collection
      description: 'Dữ liệu cùng snapshot; bao gồm bản gốc và lịch sử bất biến. Bản nháp trả blockers hiện tại.'
      parameters:
      - in: query
        name: page
        schema: {type: integer, minimum: 1, maximum: 1000000, default: 1}
      responses:
        '200':
          description: Thành công; lệnh ghi trả về sau commit.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpeningHistory'}
        default:
          description: Lỗi nghiệp vụ, quyền hoặc phiên bản.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /opening-balances/adjustments/{id}:
    get:
      summary: Đối chiếu bản điều chỉnh hoặc bản gốc
      operationId: opening_adjustment_get_id
      description: 'Dữ liệu cùng snapshot; bao gồm bản gốc và lịch sử bất biến. Bản nháp trả blockers hiện tại.'
      parameters:
      - in: path
        name: id
        required: true
        schema: {$ref: '#/components/schemas/ID'}
      responses:
        '200':
          description: Thành công; lệnh ghi trả về sau commit.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpeningAdjustment'}
        default:
          description: Lỗi nghiệp vụ, quyền hoặc phiên bản.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /opening-balances/adjustments/confirm:
    post:
      summary: Xác nhận điều chỉnh số dư
      operationId: opening_adjustment_post_confirm
      description: 'Chỉ chủ sở hữu; epoch/idempotency/version được kiểm tra trong cùng transaction. Xác nhận kiểm tra lại revision xem trước và toàn bộ phụ thuộc.'
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema: {type: string}
      - in: header
        name: X-Dataset-Epoch
        required: true
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpeningAdjustmentPost'
      responses:
        '200':
          description: Thành công; lệnh ghi trả về sau commit.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpeningState'}
        default:
          description: Lỗi nghiệp vụ, quyền hoặc phiên bản.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /opening-balances/adjustments/discard:
    post:
      summary: Bỏ nháp điều chỉnh số dư
      operationId: opening_adjustment_post_discard
      description: 'Chỉ chủ sở hữu; epoch/idempotency/version được kiểm tra trong cùng transaction. Xác nhận kiểm tra lại revision xem trước và toàn bộ phụ thuộc.'
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema: {type: string}
      - in: header
        name: X-Dataset-Epoch
        required: true
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpeningPost'
      responses:
        '200':
          description: Thành công; lệnh ghi trả về sau commit.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpeningState'}
        default:
          description: Lỗi nghiệp vụ, quyền hoặc phiên bản.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /opening-balances/confirm:
    post:
      summary: Xác nhận số dư đầu kỳ
      operationId: confirm_opening_balances
      description: 'Chỉ chủ sở hữu. Kiểm tra epoch, version và idempotency trong transaction; khởi tạo trước lần ghi sổ đầu tiên.'
      responses:
        '200':
          description: Thành công sau commit đối với lệnh ghi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpeningState'
        default:
          description: Lỗi nghiệp vụ hoặc phiên bản.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      - in: header
        name: X-Dataset-Epoch
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpeningPost'
  /opening-balances/discard:
    post:
      summary: Bỏ nháp số dư đầu kỳ
      operationId: discard_opening_balances
      description: 'Chỉ chủ sở hữu. Kiểm tra epoch, version và idempotency trong transaction; khởi tạo trước lần ghi sổ đầu tiên.'
      responses:
        '200':
          description: Thành công sau commit đối với lệnh ghi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpeningState'
        default:
          description: Lỗi nghiệp vụ hoặc phiên bản.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      - in: header
        name: X-Dataset-Epoch
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpeningPost'
  /session:
    get:
      summary: Thông tin phiên
      operationId: get_session
      description: 'Quyền: all.'
      responses:
        '200':
          description: Thành công sau khi hoàn tất thao tác.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          description: Lỗi có mã ổn định.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /setup:
    post:
      summary: Khởi tạo một lần
      operationId: post_setup
      description: 'Quyền: all.'
      responses:
        '201':
          description: Thành công sau khi hoàn tất thao tác.
          content:
            application/json:
              schema:
                type: object
                properties:
                  initialized:
                    const: true
                required:
                - initialized
        default:
          description: Lỗi có mã ổn định.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Setup'
      security: []
  /auth/login:
    post:
      summary: Đăng nhập
      operationId: post_auth_login
      description: 'Quyền: all.'
      responses:
        '200':
          description: Thành công sau khi hoàn tất thao tác.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          description: Lỗi có mã ổn định.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      security: []
  /auth/logout:
    post:
      summary: Đăng xuất
      operationId: post_auth_logout
      description: 'Quyền: all.'
      responses:
        '200':
          description: Thành công sau khi hoàn tất thao tác.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        default:
          description: Lỗi có mã ổn định.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /workspace:
    get:
      summary: Danh mục, chỉ số server và 100 chứng từ gần nhất trong kỳ
      operationId: get_workspace
      description: 'Quyền: all.'
      responses:
        '200':
          description: Thành công sau khi hoàn tất thao tác.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        default:
          description: Lỗi có mã ổn định.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - &id001
        name: period
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Period'
  /documents:
    get:
      summary: Danh sách và tổng toàn bộ tập lọc
      operationId: get_documents
      description: 'Quyền: all.'
      responses:
        '200':
          description: Thành công sau khi hoàn tất thao tác.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Documents'
        default:
          description: Lỗi có mã ổn định.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - {name: source, in: query, schema: {enum: [closing]}}
      - {name: bank, in: query, schema: {type: string}, description: Lọc chứng từ và số dư theo ID tài khoản ngân hàng}
      - *id001
      - &id003
        name: kind
        in: query
        required: false
        schema:
          enum:
          - journal
          - ledger
          - trial
          - debt
          - income
      - &id004
        name: account
        in: query
        required: false
        schema: &id002
          type: string
      - &id005
        name: status
        in: query
        required: false
        schema: *id002
      - &id006
        name: type
        in: query
        required: false
        schema: *id002
      - &id007
        name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 300
      - &id008
        name: sort
        in: query
        required: false
        schema:
          enum:
          - date
          - amount
      - &id009
        name: direction
        in: query
        required: false
        schema:
          enum:
          - asc
          - desc
      - &id010
        name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000000
      - &id011
        name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - &id012
        name: revision
        in: query
        required: false
        schema: &id015
          type: integer
          minimum: 0
    post:
      summary: Lưu nháp; sourceType khớp type hoặc manual
      operationId: post_documents
      description: 'Quyền: owner, accountant.'
      responses:
        '200':
          description: Thành công sau khi hoàn tất thao tác.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        default:
          description: Lỗi có mã ổn định.
          content:
            application/json:
