          $ref: '#/components/schemas/ID'
      - *id013
      - *id014
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
  /attachments/{id}:
    get:
      summary: Tải file đính kèm
      operationId: get_attachments_id
      description: 'Quyền: all.'
      responses:
        '200':
          description: Thành công sau khi hoàn tất thao tác.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          description: Lỗi có mã ổn định.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ID'
  /voucher-drafts:
    post:
      summary: Tính trong savepoint rồi lưu nháp; chưa thay đổi sổ hoặc phân hệ
      operationId: post_voucher_drafts
      description: "Quyền: owner, accountant."
      parameters:
      - *id013
      - *id014
      responses:
        "200":
          description: Thành công.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Voucher"}
        default:
          description: Lỗi có mã ổn định.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Operation"}
  /documents/{id}/voucher:
    get:
      summary: Đọc biểu mẫu nghiệp vụ đã lưu trong một snapshot
      operationId: get_documents_id_voucher
      description: "Quyền: owner, accountant, viewer."
      parameters:
      - {name: id, in: path, required: true, schema: {$ref: "#/components/schemas/ID"}}
      responses:
        "200":
          description: Thành công.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Voucher"}
        default:
          description: Lỗi có mã ổn định.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /documents/{id}/print:
    get:
      summary: Bản in HTML từ snapshot chứng từ và thông tin nguồn
      operationId: get_documents_id_print
      description: "Quyền: owner, accountant, viewer."
      parameters:
      - {name: id, in: path, required: true, schema: {$ref: "#/components/schemas/ID"}}
      responses:
        "200":
          description: Thành công.
          content:
            text/html:
              schema: {type: string}
        default:
          description: Lỗi có mã ổn định.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /accounts/reference:
    get:
      summary: Hệ thống 184 tài khoản từ Google Sheet do người dùng chỉ định
      operationId: get_accounts_reference
      description: "Quyền: owner, accountant, viewer."
      responses:
        "200":
          description: Thành công.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChartTemplate"}
        default:
          description: Lỗi có mã ổn định.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    post:
      summary: Bổ sung các mã tham chiếu còn thiếu, giữ nguyên tài khoản hiện có
      operationId: post_accounts_reference
      description: "Quyền: owner."
      parameters:
      - *id013
      - *id014
      responses:
        "200":
          description: Thành công.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChartApplied"}
        default:
          description: Lỗi có mã ổn định.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChartApply"}
  /bank-accounts:
    get:
      summary: Danh mục và số dư ngân hàng theo kỳ trong cùng snapshot
      operationId: get_bank_accounts
      description: "Quyền: owner, accountant, viewer."
      parameters:
      - {name: period, in: query, required: true, schema: {$ref: "#/components/schemas/Period"}}
      responses:
        "200":
          description: Thành công.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BankList"}
        default:
          description: Lỗi có mã ổn định.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    post:
      summary: Khai báo hoặc ngừng sử dụng tài khoản ngân hàng
      operationId: post_bank_accounts
      description: "Quyền: owner, accountant."
      parameters:
      - *id013
      - *id014
      responses:
        "200":
          description: Thành công.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BankAccount"}
        default:
          description: Lỗi có mã ổn định.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BankAccount"}
  /warehouses:
    get:
      summary: Danh mục kho và tồn hiện tại theo từng kho trong cùng snapshot
      responses:
        '200':
          description: Danh mục và tồn hiện tại
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WarehouseList'}
    post:
      summary: Tạo kho hoặc ngừng sử dụng; giữ mã và tên lịch sử
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/Epoch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Warehouse'}
      responses:
        '200':
          description: Kho đã lưu
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Warehouse'}
  /purchase-costs:
    get:
      summary: Các dòng chi phí mua hàng đã ghi sổ và phần còn được phân bổ
      parameters:
      - name: asOf
        in: query
        required: true
        schema: {$ref: '#/components/schemas/Date'}
      responses:
        '200':
          description: Chứng từ nguồn và số chi phí chưa phân bổ tại ngày tra cứu
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PurchaseCostSource'}
  /financial-reports/template:
    get:
      summary: Mẫu BCTC năm TT99 cho doanh nghiệp hoạt động liên tục
      operationId: get_financial_template
      responses:
        '200':
          description: Mẫu chỉ tiêu và công thức tổng có phiên bản.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FinancialTemplate'}
        default: {description: Lỗi có mã ổn định}
  /financial-reports:
    get:
      summary: Danh sách bản nháp BCTC theo năm hoặc ID
      operationId: get_financial_reports
      parameters:
      - {in: query, name: year, schema: {type: string, pattern: '^\d{4}$'}}
      - {in: query, name: id, schema: {type: string}}
      responses:
        '200':
          description: Tối đa 100 bản nháp; dùng id để đọc một bản, nếu không phải truyền year.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/FinancialReport'}}
        default: {description: Lỗi có mã ổn định}
    post:
      summary: Lưu bản nháp BCTC với version và chống gửi trùng
      operationId: post_financial_report
      description: Owner/accountant; không ghi sổ hoặc phê duyệt pháp định. Server tính lại tổng và trả các mục cần kiểm tra.
      parameters:
      - {in: header, name: Idempotency-Key, required: true, schema: {type: string}}
      - {in: header, name: X-Dataset-Epoch, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FinancialInput'}
      responses:
        '200':
          description: Bản đã commit; cho phép nháp còn thiếu dữ liệu.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FinancialReport'}
        default: {description: Lỗi có mã ổn định}
  /financial-reports/preview:
    post:
      summary: Tính tổng và kiểm tra bản nháp BCTC, không ghi dữ liệu
      operationId: post_financial_preview
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FinancialInput'}
      responses:
        '200':
          description: Công thức tính lại; ô trống giữ trống.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FinancialReport'}
        default: {description: Lỗi có mã ổn định}
  /financial-reports/source:
    get:
      summary: Cân đối sổ trong một khoảng ngày để đối chiếu BCTC
      operationId: get_financial_source
      parameters:
      - {in: query, name: from, required: true, schema: {type: string, format: date}}
      - {in: query, name: to, required: true, schema: {type: string, format: date}}
      responses:
        '200':
          description: Một snapshot, đã ghi sổ, giữ dư hai bên theo đối tượng; gồm bút toán kết chuyển. Không tự ánh xạ sang chỉ tiêu BCTC.
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Context'}
                - type: object
                  properties:
                    from: {type: string, format: date}
                    to: {type: string, format: date}
                    rows: {type: array, items: {$ref: '#/components/schemas/ReportRow'}}
        default: {description: Lỗi có mã ổn định}
  /catalog/export:
    get:
      summary: Xuất danh mục theo bộ lọc và revision đã đọc
      operationId: get_catalog_export
      parameters:
      - {name: period, in: query, required: true, schema: {type: string, pattern: '^\d{4}-\d{2}$'}}
      - {name: catalog, in: query, required: true, schema: {type: string, enum: [accounts, partners]}}
      - {name: role, in: query, schema: {type: string, enum: [all, customer, supplier]}}
      - {name: q, in: query, schema: {type: string, maxLength: 300}}
      - {name: revision, in: query, schema: {type: integer, minimum: 0}}
      - {name: format, in: query, schema: {type: string, enum: [csv, xlsx, print], default: csv}}
      responses:
        '200':
          description: Toàn bộ tập lọc; mã giữ dạng văn bản, Excel không làm tròn số lớn.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: {type: string, format: binary}
            text/csv:
              schema: {type: string}
            text/html:
              schema: {type: string}
        default:
          description: Lỗi quyền, phiên bản hoặc vượt giới hạn xuất.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /financial-reports/export:
    get:
      summary: Xuất bản BCTC đã lưu theo ID và version; mỗi mẫu một sheet Excel
      operationId: get_financial_reports_export
      parameters:
      - {name: id, in: query, required: true, schema: {type: string}}
      - {name: version, in: query, required: true, schema: {type: integer, minimum: 1}}
      - {name: format, in: query, schema: {type: string, enum: [csv, xlsx, print], default: csv}}
      responses:
        '200':
          description: Bản nháp có phiên bản và nguồn tham chiếu, không tạo bút toán.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: {type: string, format: binary}
            text/csv:
              schema: {type: string}
            text/html:
              schema: {type: string}
        default:
          description: BCTC không tồn tại, đã đổi version hoặc không có quyền đọc.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /financial-reports/print:
    get:
      summary: In bản nháp BCTC đã lưu đúng version
      operationId: get_financial_print
      parameters:
      - {in: query, name: id, required: true, schema: {type: string}}
      - {in: query, name: version, required: true, schema: {type: integer, minimum: 1}}
      responses:
        '200':
          description: HTML bản nháp chứa cả mục chưa đối chiếu; chọn In hoặc lưu PDF trong trình duyệt.
          content:
            text/html:
              schema: {type: string}
        default: {description: Lỗi có mã ổn định}

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: oanh_session
      description: HttpOnly, SameSite=Strict, 12 giờ; Secure theo cấu hình HTTPS.
  parameters:
    Epoch:
      name: X-Dataset-Epoch
      in: header
      required: true
      schema: *id002
      description: Epoch đã đọc từ session/workspace.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/ID'
      description: Một khóa cho một ý định; cùng key khác payload bị 409.
  schemas:
    OpeningPost:
      type: object
      additionalProperties: false
      required: [id, version]
      properties:
        id: {type: string}
        version: {type: integer, minimum: 1}
    OpeningInput:
      type: object
      additionalProperties: false
      required: [id, version, cutoff, source, lines, stocks, assets]
      properties:
        id: {type: string}
        version: {type: integer, minimum: 0}
        cutoff:
          type: string
          format: date
          description: Ngày đầu tháng bắt đầu sử dụng dữ liệu. Nhập số dư cuối ngày trước mốc.
        source: {type: string, minLength: 1, maxLength: 900}
        lines:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/Line'
            - type: object
              properties:
                bankAccountId: {type: string}
        stocks:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [itemId, warehouseId, quantity, value]
            properties:
              itemId: {type: string}
              warehouseId: {type: string}
              quantity: {type: string}
              value: {type: string, pattern: '^(0|[1-9][0-9]*)$'}
        assets:
          type: array
          items:
            $ref: '#/components/schemas/Asset'
    OpeningState:
      allOf:
      - $ref: '#/components/schemas/Context'
      - type: object
        required: [input, document, postedCount]
        properties:
          input:
            oneOf:
            - $ref: '#/components/schemas/OpeningInput'
            - {type: 'null'}
          document:
            oneOf:
            - $ref: '#/components/schemas/Document'
            - {type: 'null'}
          postedCount: {type: integer}
          rootId: {type: string}
          balanceVersion: {type: integer, minimum: 0}
          adjustment: {$ref: '#/components/schemas/OpeningAdjustmentInput'}
    OpeningAdjustmentInput:
      type: object
      additionalProperties: false
      required: [input, baseVersion, reason]
      properties:
        input: {$ref: '#/components/schemas/OpeningInput'}
        baseVersion: {type: integer, minimum: 0}
        reason: {type: string, minLength: 1, maxLength: 1000}
    OpeningAdjustmentPost:
      type: object
      additionalProperties: false
      required: [id, version, revision]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        version: {type: integer, minimum: 1}
        revision: {type: integer, minimum: 0}
    OpeningAdjustment:
      allOf:
      - $ref: '#/components/schemas/Context'
      - type: object
        required: [input, baseVersion, reason, before, document, confirmedVersion, blockers, actor, createdAt, confirmedAt]
        properties:
          input: {$ref: '#/components/schemas/OpeningInput'}
          baseVersion: {type: integer, minimum: 0}
          reason: {type: string}
          before: {$ref: '#/components/schemas/OpeningInput'}
          document: {$ref: '#/components/schemas/Document'}
          confirmedVersion: {type: [integer, 'null'], minimum: 0}
          createdAt: {type: string}
          confirmedAt: {type: string}
          actor: {type: string}
          blockers:
            type: array
            items:
              type: object
              required: [code, message]
              properties:
                code: {type: string}
                message: {type: string}
                documentId: {$ref: '#/components/schemas/ID'}
    OpeningHistory:
      allOf:
      - $ref: '#/components/schemas/Context'
      - type: object
        required: [items, total, initialId]
        properties:
          total: {type: integer, minimum: 0}
          initialId: {$ref: '#/components/schemas/ID'}
          items:
            type: array
            items:
              type: object
              required: [id, version, reference, reason, at, actor]
              properties:
                id: {$ref: '#/components/schemas/ID'}
                version: {type: integer, minimum: 1}
                reference: {type: string}
                reason: {type: string}
                at: {type: string, format: date-time}
                actor: {type: string}
    ID:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9_.:/-]{0,99}$
    Money:
      type: string
      pattern: ^(0|[1-9][0-9]{0,18})$
      description: Số nguyên VND không âm, tối đa 9223372036854775807; server kiểm tra range.
    Aggregate:
      type: string
      pattern: ^-?(0|[1-9][0-9]*)$
      description: Số nguyên chính xác; tổng báo cáo có thể vượt int64.
    Decimal:
      type: string
      pattern: ^(0|[1-9][0-9]{0,14})(\.[0-9]{1,6})?$
    Date:
      type: string
      format: date
    Period:
      type: string
      pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
    Error:
      type: object
      properties:
        code: *id002
        message: *id002
        request_id: *id002
      required:
      - code
      - message
      - request_id
    Context:
      type: object
      properties:
        conversionDate:
          type: string
          format: date
          description: Mốc số dư đầu kỳ đã xác nhận, nếu có.
        companyId: *id002
        companyName: *id002
        epoch: *id002
        regime: *id002
        revision: *id015
        currency:
          const: VND
        scale:
          const: 0
        period:
          $ref: '#/components/schemas/Period'
      required:
      - companyId
      - companyName
      - epoch
      - revision
      - currency
      - scale
      - regime
    User:
      type: object
      properties:
        id: *id002
        username: *id002
        name: *id002
        role:
          enum:
          - owner
          - accountant
          - viewer
        active: &id016
          type: boolean
      required:
      - id
      - username
      - name
      - role
      - active
    Login:
      type: object
      properties:
        username: *id002
        password:
          type: string
          writeOnly: true
      required:
      - username
      - password
    Setup:
      type: object
      properties:
        username: *id002
        name: *id002
        companyName: *id002
        regime: *id002
        password:
          type: string
          minLength: 12
          writeOnly: true
        confirmAccounts:
          const: true
      required:
      - username
      - password
      - name
      - companyName
      - regime
      - confirmAccounts
    Line:
      type: object
      properties:
        accountId:
          $ref: '#/components/schemas/ID'
        partnerId:
          $ref: '#/components/schemas/ID'
        description: *id002
        debit:
          $ref: '#/components/schemas/Money'
        credit:
          $ref: '#/components/schemas/Money'
        partnerName: *id002
        accountName: *id002
      required:
      - accountId
      - debit
      - credit
    Document:
      type: object
      properties:
        voucher: {type: boolean, description: Nháp nghiệp vụ phải sửa/ghi qua biểu mẫu nghiệp vụ}
        id: *id002
        reference: *id002
        description: *id002
        partnerId: *id002
        sourceType: *id002
        sourceId: *id002
        reversalOf: *id002
        policyId: *id002
        type:
          enum:
          - receipt
          - payment
          - sale
          - purchase
          - journal
        date:
          $ref: '#/components/schemas/Date'
        status:
          enum:
          - draft
          - posted
        version: *id015
        lines:
          type: array
          items:
            $ref: '#/components/schemas/Line'
      required:
      - id
      - type
      - date
      - description
      - version
      - lines
    Partner:
      type: object
      properties:
        id: *id002
        code: *id002
        name: *id002
        email: *id002
        phone: *id002
        role:
          enum:
          - customer
          - supplier
          - both
        active: *id016
      required:
      - id
      - code
      - name
      - role
      - active
    Account:
      type: object
      properties:
        parentId:
          type: string
          description: ID tài khoản cha; rỗng là cấp1. Bỏ trường trong lệnh cũ giữ nguyên quan hệ.
        parentRevision:
          type: integer
          minimum: 0
          description: Phiên bản quan hệ đã đọc, mặc định0; gửi khi đổi cha.
        id: *id002
        code: *id002
        name: *id002
        group:
          enum:
          - cash
          - receivable
          - payable
          - revenue
          - expense
          - inventory
          - asset
          - capital
          - tax
          - liability
          - wip
        requiresPartner: *id016
        active: *id016
      required:
      - id
      - code
      - name
      - group
      - requiresPartner
      - active
    AccountingPeriod:
      type: object
      properties:
        period:
          $ref: '#/components/schemas/Period'
        closed: *id016
      required:
      - period
      - closed
    Policy:
      type: object
      properties:
        id: *id002
        regime: *id002
        version: *id015
        effectiveFrom:
          $ref: '#/components/schemas/Date'
        confirmed:
          const: true
        rounding:
          enum:
          - half_up
          - half_even
          - down
        vatMethod:
          enum:
          - deduction
          - direct
        vatRates:
          type: array
          items:
            $ref: '#/components/schemas/Decimal'
        inventoryMethod:
          enum:
          - fifo
          - moving_average
        quantityScale:
          type: integer
          minimum: 0
          maximum: 6
        standardDays:
          $ref: '#/components/schemas/Decimal'
        hoursPerDay:
          $ref: '#/components/schemas/Decimal'
        corporateTaxRate:
          $ref: '#/components/schemas/Decimal'
        personalDeduction:
