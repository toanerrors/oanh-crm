name: oanh

services:
  app:
    image: oanh-crm:0.10.2
    build:
      context: .
      args:
        VCS_REF: ${OANH_REVISION:-unknown}
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 2
    mem_limit: 1g
    pids_limit: 128
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app

volumes:
  data:
    name: oanh_data

networks:
  app:
    driver: bridge
